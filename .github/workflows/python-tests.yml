name: Python tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify installable CLI
        run: |
          python -m pip install .
          phonebridge --help
      - name: Run v0.4 and v0.3 compatibility suites
        run: python -m unittest discover -s tests -v
      - name: Run recovered v0.2 suite
        run: python -m unittest discover -s legacy/v0.2 -v
      - name: Verify recovered v0.2 FastMCP server
        if: matrix.python-version == '3.10'
        run: |
          python -m pip install -r legacy/requirements-v0.2.txt
          python legacy/smoke_mcp_v02.py
