name: PhoneBridgeFixture
options:
  bundleIdPrefix: org.example.phonebridge
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  PhoneBridgeFixture:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - PhoneBridgeFixtureUITests
    sources:
      - path: PhoneBridgeFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.phonebridge.fixture
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: 'NO'
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
  PhoneBridgeFixtureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhoneBridgeFixtureUITests
    dependencies:
      - target: PhoneBridgeFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.phonebridge.fixture.uitests
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: PhoneBridgeFixture
